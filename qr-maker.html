<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>恐竜アイランド｜QR設置カード作成</title>
<style>
body{font-family:"Yu Gothic",Meiryo,sans-serif;margin:0;background:#f4f8f6;color:#233f36}.wrap{max-width:920px;margin:auto;padding:24px}.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 24px #0001}.row{display:flex;gap:8px}.row input{flex:1;padding:12px;border:1px solid #bfd4cb;border-radius:10px;font-size:15px}.row button{border:0;border-radius:10px;padding:12px 18px;background:#2f9d70;color:white;font-weight:800}.note{font-size:13px;color:#62756e;line-height:1.6}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.card{background:#fff;border:2px dashed #9ebbb0;border-radius:16px;padding:16px;text-align:center;break-inside:avoid}.card h2{margin:0 0 5px}.card p{margin:4px 0;font-weight:700}.qr{width:180px;height:180px;margin:12px auto}.url{font-size:10px;word-break:break-all;color:#60716b}@media print{body{background:#fff}.panel{box-shadow:none}.inputArea{display:none}.wrap{max-width:none;padding:0}.cards{gap:8mm}.card{min-height:125mm;border:2px dashed #999}.qr{width:45mm;height:45mm}.qr img,.qr canvas{width:45mm!important;height:45mm!important}}@media(max-width:650px){.cards{grid-template-columns:1fr}.row{flex-direction:column}}
</style>
</head>
<body><div class="wrap"><div class="panel inputArea"><h1>QR設置カード作成</h1><p class="note">公開した「index.html」のURLを入力して「QRを作成」。スタート用1枚＋恐竜ポイント用6枚を作ります。恐竜カードは該当する場所に設置します。参加者は最初から最後まで同じスマホ／同じブラウザを使ってください。</p><div class="row"><input id="base" placeholder="例：https://example.jp/dino/"><button id="make">QRを作成</button></div><p class="note">※この運営用ページだけQR生成ライブラリをインターネットから読み込みます。参加者用の index.html は外部ライブラリ不要です。</p></div><div id="cards" class="cards"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const dinos=[['trex','ティラノサウルス'],['triceratops','トリケラトプス'],['stego','ステゴサウルス'],['brachio','ブラキオサウルス'],['ptera','プテラノドン'],['ankylo','アンキロサウルス']];
function normalize(v){if(!v)return ''; if(!/^https?:\/\//i.test(v))v='https://'+v; return v.endsWith('/')?v:v+'/';}
document.getElementById('make').onclick=()=>{const base=normalize(document.getElementById('base').value.trim()); if(!base)return alert('公開URLを入力してください。'); const box=document.getElementById('cards');box.innerHTML=''; const start=document.createElement('section'); start.className='card'; start.innerHTML=`<h2>START</h2><p>冒険スタート用</p><div class="qr" id="qstart"></div><p>最初にこのQRを読み込んで<br>恐竜アイランドをスタート！</p><div class="url">${base}</div>`; box.appendChild(start); new QRCode(document.getElementById('qstart'),{text:base,width:180,height:180,correctLevel:QRCode.CorrectLevel.M}); dinos.forEach((d,i)=>{const url=base+'?piece='+d[0];const c=document.createElement('section');c.className='card';c.innerHTML=`<h2>POINT ${i+1}</h2><p>${d[1]}</p><div class="qr" id="q${i}"></div><p>このQRを読み込んで<br>地図のかけらをGET！</p><div class="url">${url}</div>`;box.appendChild(c);new QRCode(document.getElementById('q'+i),{text:url,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});});};
</script></body></html>
